name: Sync source to Gitee

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branch and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: swccq23
          GITEE_OWNER: swccq23
          GITEE_REPO: dgut-bot
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN repository secret is not configured."
            exit 1
          fi
          # checkout may replace the triggering annotated tag with its commit.
          # Restore tag objects so --follow-tags includes the release tag.
          git fetch origin '+refs/tags/*:refs/tags/*'
          git push \
            "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" \
            HEAD:main \
            --follow-tags
